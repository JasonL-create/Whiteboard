<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TurnFlow</title>
<link rel="stylesheet" href="styles.css?v=40" />
</head>
<body>
<div class="app-shell">
<div class="fixed-shell">
<header class="brand-row"><div class="brand"><img src="turnflow-logo-v36.png" alt="TurnFlow"></div><div class="company-name">Northwoods Property Management</div><div class="user-chip">JL</div></header>
<nav class="master-nav" id="masterNav"></nav>
</div>
<main class="workspace">
  <section class="page-hero" id="pageHero"></section>
  <div class="context-nav" id="contextNav"></div>
  <div class="board">
    <div class="board-head"><div>TYPE</div><div>PROPERTY</div><div>STATUS</div><div></div></div>
    <div id="rows"></div>
  </div>
</main>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modal-card">
  <div class="modal-head"><div><h2>Start New Project</h2></div><button id="closeModal" class="icon-btn">×</button></div>
  <form id="newForm">
   <div class="address-field"><div class="address-input-wrap"><span class="address-search-icon" aria-hidden="true"></span><input id="newAddress" required autocomplete="off" placeholder="Add Property Address" aria-label="Property Address"></div><div id="addressSuggestions" class="address-suggestions hidden"></div><div id="addressMatchNote" class="address-match-note hidden"></div></div>
   <div class="project-type-label">Project Type</div><div class="project-type-buttons">
    <button type="button" class="project-type-choice selected" data-project-type="turn">TURN</button>
    <button type="button" class="project-type-choice" data-project-type="listing">LISTING</button>
   </div>
   <input id="newType" type="hidden" value="turn">
   <div class="modal-actions"><button type="button" id="cancelModal">Cancel</button><button type="submit" class="primary">Create Project</button></div>
  </form>
 </div>
</div>
<script src="app.js?v=40"></script>
</body></html>
