<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TurnFlow</title>
<link rel="stylesheet" href="styles.css?v=51" />
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <img src="turnflow-logo.png?v=51" alt="TurnFlow" class="auth-logo">
    <div id="authLoginPane">
      <h1>Sign in to TurnFlow</h1>
      <p>Use your office account to access the shared workspace.</p>
      <form id="authForm">
        <label>Email<input id="authEmail" type="email" required autocomplete="email"></label>
        <label>Password<input id="authPassword" type="password" required minlength="6" autocomplete="current-password"></label>
        <div id="authMessage" class="auth-message"></div>
        <button class="primary auth-primary" type="submit">Sign In</button>
      </form>
      <button id="toggleSignup" class="auth-link" type="button">Create an account</button>
    </div>
    <div id="workspacePane" class="hidden">
      <h1>Connect your workspace</h1>
      <p>Create the Northwoods workspace once, or join it from another account.</p>
      <button id="createWorkspace" class="primary auth-primary" type="button">Create Northwoods Workspace</button>
      <div class="auth-divider"><span>or</span></div>
      <label>Workspace code<input id="workspaceCode" type="text" maxlength="12" placeholder="Enter code"></label>
      <button id="joinWorkspace" class="action-secondary auth-primary" type="button">Join Workspace</button>
      <div id="workspaceMessage" class="auth-message"></div>
    </div>
  </div>
</div>

<div class="app-shell" id="appShell">
<div class="fixed-shell">
<header class="brand-row"><div class="brand"><img src="turnflow-logo.png?v=51" alt="TurnFlow"></div><div class="company-name">Northwoods Property Management</div><button class="user-chip" id="userChip" type="button" title="Account">--</button></header>
<nav class="master-nav" id="masterNav"></nav>
</div>
<main class="workspace">
  <section class="page-hero" id="pageHero"></section>
  <div class="context-nav" id="contextNav"></div>
  <div class="board">
    <div class="board-head"><div>TYPE</div><div>PROPERTY</div><div>STATUS</div><div></div></div>
    <div id="rows"></div>
  </div>
</main>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modal-card">
  <div class="modal-head"><div><h2>Start New Project</h2></div><button id="closeModal" class="icon-btn">×</button></div>
  <form id="newForm">
   <div class="address-field"><div class="address-input-wrap"><span class="address-search-icon" aria-hidden="true"></span><input id="newAddress" required autocomplete="off" placeholder="Add Property Address" aria-label="Property Address"></div><div id="addressSuggestions" class="address-suggestions hidden"></div><div id="addressMatchNote" class="address-match-note hidden"></div></div>
   <div class="project-type-label">Project Type</div><div class="project-type-buttons">
    <button type="button" class="project-type-choice selected" data-project-type="turn">TURN</button>
    <button type="button" class="project-type-choice" data-project-type="listing">LISTING</button>
   </div>
   <input id="newType" type="hidden" value="turn">
   <div class="modal-actions"><button type="button" id="cancelModal">Cancel</button><button type="submit" class="primary">Create Project</button></div>
  </form>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=51"></script>
</body></html>
